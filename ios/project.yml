name: Conch
options:
  bundleIdPrefix: pro.imnot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}   # injected by CI from the DEVELOPMENT_TEAM secret
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"

packages:
  ConchKit:
    path: ..
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0

targets:
  Conch:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: ConchKit
        product: TermInput
      - package: ConchKit
        product: ConchCore
      - package: ConchKit
        product: ConchSSH
      - package: ConchKit
        product: ConchSync
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.imnot.conch
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO

schemes:
  Conch:
    build:
      targets:
        Conch: all
