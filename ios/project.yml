name: Tube
options:
  bundleIdPrefix: pro.imnot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}   # injected by CI from the DEVELOPMENT_TEAM secret
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"

packages:
  TubeKit:
    path: ..
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0

targets:
  Tube:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      - Shared
    dependencies:
      - target: TubeWidgets
      - package: TubeKit
        product: TermInput
      - package: TubeKit
        product: TubeCore
      - package: TubeKit
        product: TubeSSH
      - package: TubeKit
        product: TubeSync
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.imnot.tube
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
      configs:
        # Release is only built by fastlane on CI, with the cert and profile
        # from repo secrets installed (testflight.yml).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Tube AppStore

  TubeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.imnot.tube.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Tube Widgets AppStore

  TubeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Tube
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.imnot.tube.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tube
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Tube:
    build:
      targets:
        Tube: all
        TubeUITests: [test]
    test:
      targets:
        - TubeUITests
