[package]
name = "conch-sync"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Self-hosted sync for Conch. Stores end-to-end encrypted vault records only."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
getrandom = "0.4"
base64 = "0.23"
tracing = "0.1"
tower-http = { version = "0.7", features = ["cors"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
