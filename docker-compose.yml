# Self-hosted Tube: sync server, SSH relay for the web client, and the web
# client itself, behind Caddy with automatic TLS.
#
#   cp .env.example .env    # fill in the values
#   docker compose up -d
#
# Only the sync service is needed for iOS. The gateway and web services are
# for the browser client; remove them if you do not use it.
services:
  sync:
    build: ./server
    restart: unless-stopped
    environment:
      TUBE_REGISTRATION_TOKEN: ${TUBE_REGISTRATION_TOKEN:-}
      TUBE_SYNC_ORIGINS: https://${TUBE_DOMAIN:-localhost}
      TUBE_TRUST_PROXY: "1"
      RUST_LOG: info
    volumes:
      - sync-data:/data
    expose: ["8080"]

  gateway:
    build:
      context: ./server
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    environment:
      TUBE_GATEWAY_TOKENS: ${TUBE_GATEWAY_TOKENS:-}
      TUBE_GATEWAY_ALLOW: ${TUBE_GATEWAY_ALLOW:-}
      TUBE_GATEWAY_ORIGINS: https://${TUBE_DOMAIN:-localhost}
      RUST_LOG: info
    expose: ["8081"]

  web:
    build: ./web
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      TUBE_DOMAIN: ${TUBE_DOMAIN:-localhost}
    volumes:
      - caddy-data:/data
    depends_on: [sync, gateway]

volumes:
  sync-data:
  caddy-data:
