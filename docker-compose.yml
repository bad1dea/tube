# Self-hosted Conch: sync server, SSH relay for the web client, and the web
# client itself, behind Caddy with automatic TLS.
#
#   cp .env.example .env    # fill in the values
#   docker compose up -d
#
# Only the sync service is needed for iOS. The gateway and web services are
# for the browser client; remove them if you do not use it.
services:
  sync:
    build: ./server
    restart: unless-stopped
    environment:
      CONCH_REGISTRATION_TOKEN: ${CONCH_REGISTRATION_TOKEN:-}
      CONCH_SYNC_ORIGINS: https://${CONCH_DOMAIN:-localhost}
      CONCH_TRUST_PROXY: "1"
      RUST_LOG: info
    volumes:
      - sync-data:/data
    expose: ["8080"]

  gateway:
    build:
      context: ./server
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    environment:
      CONCH_GATEWAY_TOKENS: ${CONCH_GATEWAY_TOKENS:-}
      CONCH_GATEWAY_ALLOW: ${CONCH_GATEWAY_ALLOW:-}
      CONCH_GATEWAY_ORIGINS: https://${CONCH_DOMAIN:-localhost}
      RUST_LOG: info
    expose: ["8081"]

  web:
    build: ./web
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      CONCH_DOMAIN: ${CONCH_DOMAIN:-localhost}
    volumes:
      - caddy-data:/data
    depends_on: [sync, gateway]

volumes:
  sync-data:
  caddy-data:
