name: TestFlight

# Manual button in the Actions tab. (No auto-build on push, so you stay in control.)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26   # macOS Tahoe — ships Xcode 26 (Apple requires the iOS 26 SDK)
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
      # Run fastlane from ios/ (job default) so its root == cwd and
      # relative paths resolve consistently; the Gemfile lives in fastlane/.
      BUNDLE_GEMFILE: ${{ github.workspace }}/ios/fastlane/Gemfile

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Newest Xcode on the runner (26.x for the required iOS 26 SDK).
        run: |
          xc="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -switch "${xc:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios/fastlane

      # Manual signing with a fixed distribution cert + App Store profile. No
      # automatic signing → no throwaway Apple Development cert is ever created or
      # revoked (which was spamming revocation emails every build).
      - name: Install signing certificate & profile
        working-directory: ${{ github.workspace }}
        env:
          P12: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.DIST_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KPASS="$(openssl rand -hex 12)"
          security create-keychain -p "$KPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPASS" "$KEYCHAIN"
          # keep the login keychain in the search list so Apple's roots resolve
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/[",]//g')
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPASS" "$KEYCHAIN" >/dev/null
          # install the provisioning profile where Xcode looks for it
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          UUID="$(echo "$PROFILE" | base64 --decode | security cms -D 2>/dev/null | plutil -extract UUID raw -)"
          echo "$PROFILE" | base64 --decode > "$PROFILES/$UUID.mobileprovision"
          echo "installed profile UUID $UUID"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build & upload to TestFlight
        run: bundle exec fastlane beta

      - name: Save the signed IPA as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tube-ipa
          path: ios/build/*.ipa
          if-no-files-found: ignore
