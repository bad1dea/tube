name: Images

# Publishes the sync server, relay gateway and web client to GHCR.
# ghcr.io/bad1dea/tube-sync:<version>, :latest and :sha-<short>
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server/**", "web/**", ".github/workflows/images.yml"]

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: tube-sync
            context: server
            file: server/Dockerfile
          - name: tube-gateway
            context: server
            file: server/gateway/Dockerfile
          - name: tube-web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          v=$(grep -m1 '^version' server/sync/Cargo.toml | cut -d'"' -f2)
          img=ghcr.io/bad1dea/${{ matrix.name }}
          echo "list=$img:$v,$img:latest,$img:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/bad1dea/tube
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
