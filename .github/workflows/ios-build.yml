name: iOS build

# Compile check on a macOS runner without signing. Manual or on PRs touching
# Swift code, to keep macOS minutes down.
on:
  workflow_dispatch:
  pull_request:
    paths: ["ios/**", "Sources/**", "Package.swift", "Package.resolved"]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xc="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -switch "${xc:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Tube.xcodeproj -scheme Tube \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Enable SSH on the runner for UI tests
        continue-on-error: true
        run: |
          # The UI test logs in to this Mac over SSH as a throwaway user; the
          # runner account's own password cannot be reset without the old one.
          # PerSourcePenalties no: keyscans and the host-key prompt open connections
          # that never authenticate; OpenSSH 9.8+ would stall the next connect.
          # Own sshd on 2223, started directly: the launchd-managed system sshd
          # accepts TCP but can take minutes to answer the first handshakes.
          sudo mkdir -p /tmp/tube-sshd && sudo ssh-keygen -q -t ed25519 -N '' -f /tmp/tube-sshd/host_ed25519
          printf '%s\n' 'Port 2223' 'ListenAddress 127.0.0.1' 'HostKey /tmp/tube-sshd/host_ed25519' \
            'PasswordAuthentication yes' 'KbdInteractiveAuthentication yes' 'UsePAM yes' 'UseDNS no' \
            'PidFile /tmp/tube-sshd/sshd.pid' 'Subsystem sftp internal-sftp' 'AllowTcpForwarding yes' \
            'MaxStartups 200' 'PerSourcePenalties no' 'LogLevel VERBOSE' | sudo tee /tmp/tube-sshd/sshd_config >/dev/null
          U=tubetest
          PW="ui-$(openssl rand -hex 8)"
          echo "::add-mask::$PW"
          sudo dscl . -create /Users/$U
          sudo dscl . -create /Users/$U UserShell /bin/zsh
          sudo dscl . -create /Users/$U RealName "Tube UI test"
          sudo dscl . -create /Users/$U UniqueID 5011
          sudo dscl . -create /Users/$U PrimaryGroupID 20
          sudo dscl . -create /Users/$U NFSHomeDirectory /Users/$U
          sudo dscl . -passwd /Users/$U "$PW"
          sudo mkdir -p /Users/$U && sudo chown $U:staff /Users/$U
          # Empty zshrc skips zsh's first-run wizard; Homebrew on PATH for tmux/screen.
          printf 'PS1="%%n %%1~ %%# "\n' | sudo -u $U tee /Users/$U/.zshrc >/dev/null
          brew install tmux screen >/dev/null 2>&1 || true
          echo /opt/homebrew/bin | sudo tee /etc/paths.d/homebrew >/dev/null
          sudo rm -rf /Users/$U/c
          sudo dseditgroup -o edit -a $U -t user com.apple.access_ssh 2>/dev/null || true
          echo "UITEST_USER=$U" >> "$GITHUB_ENV"
          echo "UITEST_PW=$PW" >> "$GITHUB_ENV"
          sleep 2
          sudo /usr/sbin/sshd -f /tmp/tube-sshd/sshd_config -E /tmp/tube-sshd/sshd.log
          for i in $(seq 1 30); do ssh-keyscan -T 5 -p 2223 127.0.0.1 2>/dev/null | grep -q ssh-ed25519 && break; sleep 1; done
          ssh-keyscan -T 5 -p 2223 127.0.0.1 2>/dev/null | grep -q ssh-ed25519 && echo "sshd answering on 2223" || { echo "sshd on 2223 not answering"; sudo cat /tmp/tube-sshd/sshd.log; exit 1; }

      - name: UI tests on simulator
        working-directory: ios
        run: |
          set -o pipefail
          # UI automation otherwise waits for an authorization prompt nobody can answer.
          sudo automationmodetool enable-automationmode-without-authentication || true
          xcrun simctl boot "$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name']]; print(ids[-1])")" || true
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name']]; print(ids[-1] if ids else '')")
          echo "simulator $UDID"
          # TEST_RUNNER_-prefixed environment variables reach the test process.
          export TEST_RUNNER_TUBE_UITEST_HOST=127.0.0.1 TEST_RUNNER_TUBE_UITEST_PORT=2223 TEST_RUNNER_TUBE_UITEST_USER="${UITEST_USER:-runner}" TEST_RUNNER_TUBE_UITEST_PASSWORD="$UITEST_PW"
          xcodebuild test -project Tube.xcodeproj -scheme Tube -destination "id=$UDID" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 1500 \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO 2>&1 | tee uitest.log | grep -E "error:|Test Case|XCTAssert|failed|passed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" uitest.log

      - name: Check what the sessions did on the server
        if: always()
        run: |
          d=/Users/${UITEST_USER:-tubetest}/c
          fail=0
          check() { if eval "$2"; then echo "PASS  $1"; else echo "FAIL  $1"; fail=1; fi; }
          check "connect + typing"            "sudo test -f $d/ok-connect -a -f $d/ok-typed"
          check "suggestion chip completes"   "sudo test -f $d/ok-chip-seed"
          check "ctrl latch: ^C interrupts"   "sudo grep -qx 130 $d/ok-ctrl-c && ! sudo test -f $d/bad-not-interrupted"
          check "tab completion"              "sudo test -f $d/ok-tab"
          check "up arrow history"            "[ \"\$(sudo wc -l < $d/ok-arrow 2>/dev/null | tr -d ' ')\" = 2 ]"
          check "drag left = arrow keys"      "sudo grep -q \$'\\e\\[D' $d/ok-swipe-keys"
          check "drag down = wheel (mouse on)" "sudo grep -q \$'\\e\\[<64;' $d/ok-wheel"
          check "vim insert + esc + :wq"      "sudo grep -q 'hello from vim' $d/ok-vim.txt"
          check "tmux inside + ^B d detach"   "sudo test -f $d/ok-in-tmux && sudo grep -q tube $d/ok-tmux-ls"
          check "screen inside + ^A d detach" "sudo test -f $d/ok-in-screen && sudo grep -q tube $d/ok-screen-ls"
          check "panel snippet + keyboard"    "sudo test -s $d/ok-snippet-df"
          check "two sessions, switch"        "sudo test -f $d/ok-session1 -a -f $d/ok-session2"
          check "password prompt connects"    "sudo test -f $d/ok-password-prompt"
          sudo ls -la $d || true
          echo "--- sshd log (last 30) ---"; sudo tail -30 /tmp/tube-sshd/sshd.log || true
          exit $fail

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p shots crashes
          cp ~/Library/Logs/DiagnosticReports/Tube*.ips crashes/ 2>/dev/null || true
          ls crashes
          [ -d "$RUNNER_TEMP/ui.xcresult" ] && xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path shots || true
          ls shots | head -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: |
            shots
            ios/uitest.log
            crashes
          if-no-files-found: ignore

      - name: TubeKit tests on macOS
        run: swift test --filter 'TermInputTests|TubeCoreTests'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios/build.log
