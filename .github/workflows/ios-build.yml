name: iOS build

# Compile check on a macOS runner without signing. Manual or on PRs touching
# Swift code, to keep macOS minutes down.
on:
  workflow_dispatch:
  pull_request:
    paths: ["ios/**", "Sources/**", "Package.swift", "Package.resolved"]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xc="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -switch "${xc:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Tube.xcodeproj -scheme Tube \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Enable SSH on the runner for UI tests
        continue-on-error: true
        run: |
          # The UI test logs in to this Mac over SSH as a throwaway user; the
          # runner account's own password cannot be reset without the old one.
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || sudo systemsetup -setremotelogin on || true
          U=tubetest
          PW="ui-$(openssl rand -hex 8)"
          echo "::add-mask::$PW"
          sudo dscl . -create /Users/$U
          sudo dscl . -create /Users/$U UserShell /bin/zsh
          sudo dscl . -create /Users/$U RealName "Tube UI test"
          sudo dscl . -create /Users/$U UniqueID 5011
          sudo dscl . -create /Users/$U PrimaryGroupID 20
          sudo dscl . -create /Users/$U NFSHomeDirectory /Users/$U
          sudo dscl . -passwd /Users/$U "$PW"
          sudo mkdir -p /Users/$U && sudo chown $U:staff /Users/$U
          sudo dseditgroup -o edit -a $U -t user com.apple.access_ssh 2>/dev/null || true
          echo "UITEST_USER=$U" >> "$GITHUB_ENV"
          echo "UITEST_PW=$PW" >> "$GITHUB_ENV"
          sleep 2
          nc -z 127.0.0.1 22 && echo "sshd listening" || echo "sshd not listening; terminal steps will see a failed connection"

      - name: UI tests on simulator
        working-directory: ios
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name']]; print(ids[-1] if ids else '')")
          echo "simulator $UDID"
          xcodebuild test -project Tube.xcodeproj -scheme Tube -destination "id=$UDID" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            TEST_RUNNER_TUBE_UITEST_HOST=127.0.0.1 TEST_RUNNER_TUBE_UITEST_USER="${UITEST_USER:-runner}" \
            TEST_RUNNER_TUBE_UITEST_PASSWORD="$UITEST_PW" 2>&1 | tee uitest.log | grep -E "error:|Test Case|XCTAssert|failed|passed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" uitest.log

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p shots
          [ -d "$RUNNER_TEMP/ui.xcresult" ] && xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path shots || true
          ls shots | head -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: shots
          if-no-files-found: ignore

      - name: TubeKit tests on macOS
        run: swift test --filter 'TermInputTests|TubeCoreTests'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios/build.log
